name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy. Defaults to this workflow commit SHA."
        required: false
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    name: Deploy to EC2 instances
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to staging and production via SSM
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail

          SCRIPT_BASE64=$(base64 -w 0 .github/workflows/deploy.sh)

          deploy_environment() {
            local environment="$1"

            echo "Deploying $IMAGE_TAG to $environment"

            local command
            command="echo '$SCRIPT_BASE64' | base64 -d > /tmp/deploy.sh && bash /tmp/deploy.sh '$IMAGE_TAG'"

            local parameters_file
            parameters_file="ssm-parameters-$environment.json"

            jq -n --arg command "$command" \
              '{commands: [$command]}' > "$parameters_file"

            local instance_ids
            instance_ids=$(aws ec2 describe-instances \
              --region us-east-1 \
              --filters "Name=tag:Name,Values=$environment" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text)

            if [ -z "$instance_ids" ] || [ "$instance_ids" = "None" ]; then
              echo "No running EC2 instance found for tag Name=$environment"
              exit 1
            fi

            echo "EC2 instance(s) for $environment: $instance_ids"

            local instance_ids_csv
            instance_ids_csv=$(tr -s '[:space:]' ',' <<< "$instance_ids" | sed 's/,$//')

            local ssm_ready_count
            local instance_count
            instance_count=$(wc -w <<< "$instance_ids")

            for attempt in {1..24}; do
              ssm_ready_count=$(aws ssm describe-instance-information \
                --region us-east-1 \
                --filters "Key=InstanceIds,Values=$instance_ids_csv" \
                --query 'length(InstanceInformationList[?PingStatus==`Online`])' \
                --output text)

              if [ "$ssm_ready_count" -eq "$instance_count" ]; then
                break
              fi

              echo "Waiting for $environment instance(s) to be online in SSM ($ssm_ready_count/$instance_count)"
              sleep 10
            done

            if [ "$ssm_ready_count" -ne "$instance_count" ]; then
              echo "$environment instance(s) are not online in SSM. Check SSM Agent and the EC2 IAM instance profile."
              exit 1
            fi

            local send_command_output
            send_command_output=$(aws ssm send-command \
              --region us-east-1 \
              --instance-ids $instance_ids \
              --document-name "AWS-RunShellScript" \
              --parameters "file://$parameters_file" \
              --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/lacrei/deploy" \
              --max-concurrency "1" \
              --max-errors "0" \
              --query "Command.{Id:CommandId,TargetCount:TargetCount}" \
              --output json)

            local command_id
            command_id=$(jq -r '.Id' <<< "$send_command_output")

            local target_count
            target_count=$(jq -r '.TargetCount' <<< "$send_command_output")

            if [ "$target_count" -eq 0 ]; then
              echo "No SSM managed instance found for tag Name=$environment"
              exit 1
            fi

            echo "SSM Command ID for $environment: $command_id"

            while true; do
              invocations=$(aws ssm list-command-invocations \
                --region us-east-1 \
                --command-id "$command_id" \
                --details \
                --output json)

              invocation_count=$(jq '.CommandInvocations | length' <<< "$invocations")
              pending_count=$(jq '[.CommandInvocations[].Status | select(. == "Pending" or . == "InProgress" or . == "Delayed")] | length' <<< "$invocations")
              failed_count=$(jq '[.CommandInvocations[].Status | select(. == "Cancelled" or . == "TimedOut" or . == "Failed" or . == "Cancelling")] | length' <<< "$invocations")

              if [ "$invocation_count" -eq "$target_count" ] && [ "$pending_count" -eq 0 ]; then
                echo "$invocations" | jq -r '.CommandInvocations[] | "Instance: \(.InstanceId)\nStatus: \(.Status)\nOutput:\n\(.CommandPlugins[].Output)\n"'

                if [ "$failed_count" -gt 0 ]; then
                  exit 1
                fi

                break
              fi

              sleep 5
            done
          }

          deploy_environment staging
          deploy_environment production

      - name: Notify successful deploy via SNS
        env:
          SNS_PHONE_NUMBER: ${{ secrets.SNS_PHONE_NUMBER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$SNS_PHONE_NUMBER" ]; then
            echo "SNS_PHONE_NUMBER is not configured. Skipping deploy notification."
            exit 0
          fi

          aws sns publish \
            --region us-east-1 \
            --phone-number "$SNS_PHONE_NUMBER" \
            --message "Deploy Lacrei finalizado com sucesso. Imagem: $IMAGE_TAG. Ambientes: staging e production."
