name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lacrei:test .

      - name: Start container
        run: docker run -d --name lacrei-test -p 3000:3000 lacrei:test

      - name: Check status endpoint
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:3000/status; then
              exit 0
            fi

            echo "API ainda não está pronta. Tentativa $i/10"
            sleep 2
          done

          echo "API não respondeu após 10 tentativas"
          docker ps -a
          docker logs lacrei-test
          exit 1